# Blueprint de Render para NEXO JOVEN 360.
# Despliega SOLO el backend + PostgreSQL. El frontend vive en Vercel
# (https://www.nexojoven360.site), por eso aquí no hay servicio estático.
# Crear desde el panel de Render: New → Blueprint → elegir este repositorio.
# Si Render asigna otro subdominio al backend, actualizar VITE_API_BASE_URL en Vercel.

databases:
  - name: nexo-joven-360-db
    plan: free
    databaseName: nexo_joven_360
    user: nexo

services:
  - type: web
    name: nexo-joven-360-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    # El plan gratuito no admite preDeployCommand: migraciones y datos semilla (idempotentes) van al arrancar.
    startCommand: alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-joven-360-db
          property: connectionString
      # Orígenes permitidos: el frontend desplegado en Vercel (con y sin www).
      - key: CORS_ORIGINS
        value: https://www.nexojoven360.site, https://nexojoven360.site

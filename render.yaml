# Blueprint de Render para la demo pública de NEXO JOVEN 360 (planes gratuitos).
# Crear desde el panel de Render: New → Blueprint → elegir este repositorio.
# Si Render asigna otro subdominio a algún servicio, ajustar CORS_ORIGINS y VITE_API_BASE_URL.

databases:
  - name: nexo-joven-360-db
    plan: free
    databaseName: nexo_joven_360
    user: nexo

services:
  - type: web
    name: nexo-joven-360-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    # El plan gratuito no admite preDeployCommand: migraciones y datos semilla (idempotentes) van al arrancar.
    startCommand: alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-joven-360-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://nexo-joven-360.onrender.com"]'

  - type: web
    name: nexo-joven-360
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE_URL
        value: https://nexo-joven-360-api.onrender.com
    # La app usa rutas del navegador (/panel, /brujula…): todo se sirve desde index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

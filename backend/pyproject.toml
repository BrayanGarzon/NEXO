[project]
name = "nexo-joven-360-backend"
version = "0.1.0"
description = "API de NEXO JOVEN 360"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "httpx2>=2.15,<3.0",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
